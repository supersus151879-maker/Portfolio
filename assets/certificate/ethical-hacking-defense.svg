    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 40 M 0 0 L 40 40" fill="none" stroke="#dcfce7" stroke-width="0.7"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="850" fill="url(#bgGrad)"/>
  <rect width="1200" height="850" fill="url(#gridPattern)"/>

  <!-- Outer Double Border -->
  <rect x="25" y="25" width="1150" height="800" fill="none" stroke="#10b981" stroke-width="4" rx="8"/>
  <rect x="35" y="35" width="1130" height="780" fill="none" stroke="#0f172a" stroke-width="1.5" rx="6"/>

  <!-- Corner Decorative Accents -->
  <path d="M 25 65 L 65 25 M 25 75 L 75 25" stroke="#10b981" stroke-width="2"/>
  <path d="M 1175 65 L 1135 25 M 1175 75 L 1125 25" stroke="#10b981" stroke-width="2"/>
  <path d="M 25 785 L 65 825 M 25 775 L 75 825" stroke="#10b981" stroke-width="2"/>
  <path d="M 1175 785 L 1135 825 M 1175 775 L 1125 825" stroke="#10b981" stroke-width="2"/>

  <!-- Top Header Branding Banner -->
  <path d="M 35 35 L 1165 35 L 1165 140 L 35 140 Z" fill="#0f172a"/>
  <path d="M 35 140 L 1165 140 L 1165 146 L 35 146 Z" fill="url(#emeraldGrad)"/>

