  <text x="150" y="108" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="14" fill="#6ee7b7" letter-spacing="3">ETHICAL HACKING &amp; NETWORK DEFENSE DIVISION</text>

  <!-- Badge Tag -->
  <rect x="940" y="65" width="180" height="36" rx="18" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1.5"/>
  <text x="1030" y="88" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="13" fill="#34d399" text-anchor="middle" letter-spacing="1">VERIFIED CREDENTIAL</text>

  <!-- Certificate Title Header -->
  <text x="600" y="235" font-family="'Georgia', serif" font-weight="700" font-size="38" fill="#0f172a" text-anchor="middle" letter-spacing="3">CERTIFICATE OF MASTERY</text>
  <text x="600" y="270" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="14" fill="#10b981" text-anchor="middle" letter-spacing="4">THIS CERTIFIES THAT</text>

