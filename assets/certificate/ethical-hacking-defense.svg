    <path d="M 31 12 L 48 20 V 34 C 48 45, 38 52, 31 55 C 24 52, 14 45, 14 34 V 20 Z" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <path d="M 27 33 L 30 36 L 37 27" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
