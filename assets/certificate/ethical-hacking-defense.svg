  <!-- Footer Metadata -->
  <text x="60" y="795" font-family="'Monaco', 'Courier New', monospace" font-size="12" fill="#64748b">Issue Date: February 10, 2026</text>
  <text x="600" y="795" font-family="'Monaco', 'Courier New', monospace" font-size="12" fill="#64748b" text-anchor="middle">Credential ID: EHND-2026-90482-PM</text>
  <text x="1140" y="795" font-family="'Monaco', 'Courier New', monospace" font-size="12" fill="#64748b" text-anchor="end">Status: VERIFIED &amp; ACTIVE</text>
</svg>
