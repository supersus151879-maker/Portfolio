    <path d="M 10 30 Q 40 10, 70 35 T 120 15 T 160 30 T 190 20" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="45" x2="220" y2="45" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="110" y="65" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#0f172a" text-anchor="middle">Elena Rostova</text>
