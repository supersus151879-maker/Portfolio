  <line x1="300" y1="385" x2="900" y2="385" stroke="url(#emeraldGrad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Certificate Description -->
  <text x="600" y="440" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="18" fill="#334155" text-anchor="middle">has successfully completed comprehensive practical evaluation and coursework in</text>
  <text x="600" y="480" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="26" fill="#0f172a" text-anchor="middle" letter-spacing="1">Ethical Hacking &amp; Network Defense</text>

  <text x="600" y="525" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="15" fill="#64748b" text-anchor="middle">Demonstrating advanced proficiency in vulnerability assessment, threat mitigation, network traffic inspection,</text>
  <text x="600" y="550" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="15" fill="#64748b" text-anchor="middle">intrusion detection systems, and defensive cybersecurity operations.</text>

