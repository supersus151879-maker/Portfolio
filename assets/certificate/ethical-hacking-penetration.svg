<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%">
  <defs>
    <linearGradient id="tcmRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="tcmCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fafafa"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="850" fill="url(#bgGrad)"/>

  <!-- Right Cyber Artwork Wave -->
  <path d="M 800 0 Q 750 425 1200 850 L 1200 0 Z" fill="#0f172a"/>
  <path d="M 800 0 Q 750 425 1200 850" fill="none" stroke="url(#tcmRed)" stroke-width="4"/>

  <!-- Outer Border -->
  <rect x="25" y="25" width="1150" height="800" fill="none" stroke="#ef4444" stroke-width="3" rx="8"/>

  <!-- TCM Logo & Brand -->
  <g transform="translate(60, 55)">
    <rect x="0" y="0" width="56" height="56" rx="12" fill="url(#tcmRed)"/>
    <path d="M 18 15 L 38 15 L 28 42 Z" fill="#ffffff"/>
    <path d="M 24 25 L 32 25 L 28 35 Z" fill="#ef4444"/>
  </g>

  <text x="132" y="82" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="24" fill="#0f172a" letter-spacing="2">TCM SECURITY ACADEMY</text>
  <text x="132" y="104" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="13" fill="#ef4444" letter-spacing="3">OFFICIAL CERTIFICATION CREDENTIAL</text>

  <!-- Header Title -->
  <text x="450" y="230" font-family="'Georgia', serif" font-weight="700" font-size="38" fill="#0f172a" text-anchor="middle" letter-spacing="2">CERTIFICATE OF COMPLETION</text>
  <text x="450" y="265" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="14" fill="#64748b" text-anchor="middle" letter-spacing="3">THIS CERTIFIES THAT</text>

  <!-- Recipient Name -->
  <text x="450" y="355" font-family="'Georgia', serif" font-weight="700" font-size="52" fill="#0f172a" text-anchor="middle">PRITAM MONDAL</text>
  <line x1="200" y1="380" x2="700" y2="380" stroke="url(#tcmRed)" stroke-width="3" stroke-linecap="round"/>

  <!-- Certificate Description -->
  <text x="450" y="435" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="18" fill="#334155" text-anchor="middle">has successfully completed all requirements, exams, and practical labs for</text>
  <text x="450" y="475" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="26" fill="#ef4444" text-anchor="middle" letter-spacing="1">Ethical Hacking &amp; Penetration Testing</text>

  <text x="450" y="520" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="15" fill="#64748b" text-anchor="middle">Demonstrating practical competency in Metasploit, Nmap, Active Directory exploitation,</text>
  <text x="450" y="545" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="15" fill="#64748b" text-anchor="middle">web application vulnerability assessment, wireless auditing, and professional pentest reporting.</text>

  <!-- Gold Seal -->
  <g transform="translate(450, 675)">
    <path d="M -25 20 L -40 80 L -20 68 L 0 80 L -10 20 Z" fill="#b45309"/>
    <path d="M 25 20 L 40 80 L 20 68 L 0 80 L 10 20 Z" fill="#d97706"/>
    <circle cx="0" cy="0" r="50" fill="url(#goldGrad)" stroke="#b45309" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="0" y="-8" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="10" fill="#78350f" text-anchor="middle" letter-spacing="1">TCM SECURITY</text>
    <text x="0" y="8" font-family="'Georgia', serif" font-weight="700" font-size="13" fill="#78350f" text-anchor="middle">PENTEST</text>
    <text x="0" y="22" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="9" fill="#78350f" text-anchor="middle" letter-spacing="1">VERIFIED</text>
  </g>

  <!-- Left Signature Block -->
  <g transform="translate(120, 650)">
    <path d="M 10 25 Q 30 5, 50 30 T 90 20 T 130 35 T 170 15" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="45" x2="200" y2="45" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="100" y="65" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#0f172a" text-anchor="middle">Heath M. Adams</text>
    <text x="100" y="83" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="12" fill="#64748b" text-anchor="middle">Founder &amp; CEO, TCM Security</text>
  </g>

  <!-- Right Signature Block -->
  <g transform="translate(620, 650)">
    <path d="M 10 30 Q 40 10, 70 35 T 120 15 T 160 30 T 190 20" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="45" x2="200" y2="45" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="100" y="65" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#0f172a" text-anchor="middle">Alexandre Kouznetsov</text>
    <text x="100" y="83" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="12" fill="#64748b" text-anchor="middle">Lead Security Evaluator</text>
  </g>

  <!-- Footer Metadata -->
  <text x="60" y="795" font-family="'Monaco', 'Courier New', monospace" font-size="12" fill="#64748b">Issue Date: January 02, 2026</text>
  <text x="450" y="795" font-family="'Monaco', 'Courier New', monospace" font-size="12" fill="#64748b" text-anchor="middle">Certificate ID: cert_ehpt927x-pm</text>
  <text x="750" y="795" font-family="'Monaco', 'Courier New', monospace" font-size="12" fill="#64748b" text-anchor="end">Status: VERIFIED &amp; ACTIVE</text>
</svg>
